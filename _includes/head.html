<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign page_title = site.title %}{% if page.title %}{% assign page_title = page.title | append: " | " | append: site.title %}{% endif %}
<title>{{ page_title }}{% unless page.title %}, {{ site.author.affiliation }}{% endunless %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip }}">
<meta name="author" content="{{ site.author.name }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta name="color-scheme" content="light dark">
<meta name="google-site-verification" content="ZDH6PehL3hn3zHkHQya5FzUFcQ-cdzx7gZxmrIrH430" />

<!-- Link previews (messengers, social media) -->
<meta property="og:type" content="profile">
<meta property="og:title" content="{{ site.author.name }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ site.author.photo | absolute_url }}">
<meta property="profile:first_name" content="{{ site.author.name | split: ' ' | first }}">
<meta property="profile:last_name" content="{{ site.author.name | split: ' ' | last }}">
<meta name="twitter:card" content="summary">

<!-- Structured data: tells search engines this page is about a person -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ site.author.name | jsonify }},
  "url": {{ "/" | absolute_url | jsonify }},
  "image": {{ site.author.photo | absolute_url | jsonify }},
  "email": {{ site.author.email | prepend: "mailto:" | jsonify }},
  "jobTitle": {{ site.author.position | jsonify }},
  "affiliation": { "@type": "CollegeOrUniversity", "name": {{ site.author.affiliation | jsonify }}, "url": {{ site.author.affiliation_url | jsonify }} },
  "alumniOf": { "@type": "CollegeOrUniversity", "name": {{ site.author.alumni_of | jsonify }} },
  "knowsAbout": {{ site.author.research_topics | jsonify }}{% assign same = "" | split: "" %}{% for l in site.links %}{% if l[1] != "" %}{% assign same = same | push: l[1] %}{% endif %}{% endfor %}{% if same.size > 0 %},
  "sameAs": {{ same | jsonify }}{% endif %}
}
</script>

<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,400&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
